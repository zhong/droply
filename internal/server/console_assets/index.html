<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Droply 控制台</title>
    <link rel="stylesheet" href="/console/style.css" />
    <script src="/console/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/console/" class="brand">Droply <span>控制台</span></a>
      <div id="identity" hidden>
        <span id="email"></span><button id="logout">退出</button>
      </div>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="login" hidden class="login card">
        <p class="eyebrow">你的项目，尽在掌握</p>
        <h1>登录控制台</h1>
        <p class="muted">使用团队账户查看部署与项目状态。</p>
        <form id="login-form">
          <label for="email-input">邮箱</label
          ><input
            id="email-input"
            type="email"
            autocomplete="username"
            required
          /><label for="password-input">密码</label
          ><input
            id="password-input"
            type="password"
            autocomplete="current-password"
            required
          /><button type="submit" class="primary">登录</button>
        </form>
        <p id="login-error" role="alert" class="error"></p>
      </section>
      <section id="workspace" hidden>
        <div class="heading">
          <div>
            <p class="eyebrow">工作空间</p>
            <h1>项目</h1>
          </div>
          <button id="refresh">刷新</button>
        </div>
        <div class="layout">
          <aside class="card">
            <h2>获授权项目</h2>
            <div id="projects"></div>
          </aside>
          <div id="detail">
            <section class="card">
              <h2>选择一个项目</h2>
              <p class="muted">查看部署、域名和访问统计。</p>
            </section>
          </div>
        </div>
      </section>
    </main>
    <footer>Droply · 私有静态站点发布</footer>
  </body>
</html>
