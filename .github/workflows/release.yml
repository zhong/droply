name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Report actual toolchain
        run: go version
      - name: Controlled ACME
        run: sh scripts/test-acme.sh
      - name: Restore into a new directory and serve real HTTP and TLS
        run: sh scripts/test-required.sh TestRestoreRealHTTPAndTLSAccessDomainsAndRollback ./internal/backup

  build:
    needs: [test, acceptance]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            binaries: cli
          - goos: darwin
            goarch: amd64
            binaries: cli
          - goos: linux
            goarch: amd64
            binaries: cli+server
          - goos: windows
            goarch: amd64
            binaries: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Report actual toolchain
        run: go version
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME}
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/droply-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} \
            ./cmd/droply
          if [ "${{ matrix.binaries }}" = "cli+server" ]; then
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/droply-server-${{ matrix.goos }}-${{ matrix.goarch }} \
              ./cmd/droply-server
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/droply-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum droply-* > checksums.txt
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            droply-* checksums.txt
