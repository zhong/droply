name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Report actual toolchain
        run: go version
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet (including integration tests)
        run: CGO_ENABLED=0 go vet -tags=integration ./...
      - name: Integration (browser and ACME have separate jobs)
        run: CGO_ENABLED=0 go test -tags=integration -count=1 -v ./...
      - name: Installer contracts
        run: sh scripts/setup_test.sh

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Report actual toolchain
        run: go version
      - run: CGO_ENABLED=1 go test -race -tags=integration -shuffle=on -count=1 ./...

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Report actual toolchain
        run: go version
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Check and rebuild console
        run: |
          npm --prefix console ci
          npm --prefix console run build
          git diff --exit-code -- internal/server/console_assets internal/server/visitor_assets
      - name: Install Chromium acceptance dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.61.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real Chromium acceptance (must execute)
        env:
          DROPLY_CONSOLE_BROWSER: '1'
          DROPLY_VISITOR_BROWSER: '1'
          DROPLY_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
        run: |
          sh scripts/test-required.sh TestConsoleBrowser ./internal/server
          sh scripts/test-required.sh TestVisitorBrowser ./internal/server
